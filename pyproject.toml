[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "drainhound"
dynamic = ["version"]
description = "Where a Linux laptop's battery goes, how long it will last, and what would make it last longer, measured on your machine by experiment"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"  # compression.zstd
authors = [{ name = "zyansheep" }]
keywords = ["battery", "power", "laptop", "linux", "waybar", "experiments"]
classifiers = [
  "Environment :: Console",
  "Environment :: X11 Applications :: GTK",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Hardware",
  "Topic :: System :: Monitoring",
  "Topic :: System :: Power (UPS)",
]
# The collector, votes, throttle and freeze need only the standard library;
# the estimator, experiments and panel fit their models with NumPy and SciPy.
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
# The panel: GTK 4, libadwaita and gtk4-layer-shell come from the system.
panel = ["PyGObject>=3.48", "pycairo>=1.25"]

[project.scripts]
drainhound = "drainhound.cli:main"

[project.urls]
Homepage = "https://github.com/zyansheep/drainhound"

[tool.setuptools.dynamic]
version = { attr = "drainhound.__version__" }

[tool.setuptools.package-data]
drainhound = ["menu-theme.css"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
# Named rather than ruff's defaults, which change between versions. CI runs `ruff check`.
select = ["E4", "E7", "E9", "F", "B"]
# Lambdas bound to names and `a; b` lines are this code's style; zip(strict=) would change behaviour.
ignore = ["E731", "E702", "B905"]

[tool.ruff.format]
quote-style = "single"

[tool.basedpyright]
# Type checking (CI: `basedpyright`, the flake's lint check). Errors the code had when this
# was added are in .basedpyright/baseline.json; new ones fail. Fixing old ones shrinks it.
include = ["src", "tests", "tools"]
pythonVersion = "3.14"
typeCheckingMode = "standard"
